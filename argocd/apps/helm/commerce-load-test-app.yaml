apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: commerce-load-test
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/euneun023/commerce.git
    targetRevision: main
    path: helm-chart/commerce-api
    helm:
      valueFiles:
        - values.load-test.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: load-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
