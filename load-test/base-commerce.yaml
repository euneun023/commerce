apiVersion: apps/v1
kind: Deployment
metadata:
  name: base-commerce
  namespace: load-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: base-commerce
  template:
    metadata:
      labels:
        app: base-commerce
    spec:
      containers:
        - name: commerce
          image: 125773060303.dkr.ecr.ap-northeast-2.amazonaws.com/commerce:f58e713
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mariadb://mariadb:3306/commerce
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: admin123
            - name: SPRING_REDIS_HOST
              value: redis-master.redis.svc.cluster.local
            - name: SPRING_REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "700m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: base-commerce
  namespace: load-test
spec:
  selector:
    app: base-commerce
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: base-commerce-hpa
  namespace: load-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: base-commerce
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
