{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: commerce-dotory-site
  namespace: commerce
spec:
  secretName: commerce-dotory-site
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - commerce.dotory.site
{{- end }}
