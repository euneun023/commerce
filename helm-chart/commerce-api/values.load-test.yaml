namespaceOverride: load-test

api:
  enabled: false

ingress:
  enabled: false

certificate:
  enabled: false

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false

traefik:
  enabled: false

loadTest:
  enabled: true

  image:
    repository: 125773060303.dkr.ecr.ap-northeast-2.amazonaws.com/commerce
    tag: "f58e713"
    pullPolicy: Always

  probes:
    path: /healthz
    port: 8080
    readiness:
      initialDelaySeconds: 110
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 140
      periodSeconds: 20
    startupProbe:
      httpGet:
        path: /healthz
        port: 8080
      failureThreshold: 30
      periodSeconds: 5

  commonEnv:
    datasource:
      url: jdbc:mariadb://mariadb:3306/commerce
      username: root
      password: admin123
    redis:
      host: redis-master
      port: 6379
      password: redis1234

  workloads:
    - name: base-commerce
      replicas: 2
      service:
        port: 80
        targetPort: 8080
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 4
        targetCPUUtilizationPercentage: 30
      doNotDisrupt: false
      pdb:
        enabled: false
